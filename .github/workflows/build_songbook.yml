name: Build Songbook

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_pdf:

    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
          
    - name: Install tests dependencies
      run: dotnet restore $GITHUB_WORKSPACE/SonglistGeneratorTests/SonglistGeneratorTests.csproj
    
    - name: Build tests
      run: dotnet build $GITHUB_WORKSPACE/SonglistGeneratorTests/SonglistGeneratorTests.csproj --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test $GITHUB_WORKSPACE/SonglistGeneratorTests/SonglistGeneratorTests.csproj --no-restore --verbosity normal
      
    - name: Install SonglistGenerator dependencies
      run: dotnet restore $GITHUB_WORKSPACE/SonglistGenerator/SonglistGenerator.csproj
    
    - name: Build SonglistGenerator
      run: dotnet build $GITHUB_WORKSPACE/SonglistGenerator/SonglistGenerator.csproj --configuration Release --no-restore
      
    - name: Run SonglistGenerator
      run: dotnet $GITHUB_WORKSPACE/SonglistGenerator/bin/Release/net10.0/SonglistGenerator.dll $GITHUB_WORKSPACE/main "$GITHUB_WORKSPACE/Songbook v3.0 r${{github.run_number}}" 1
    
    - name: Upload SonglistGenerator.dll
      uses: actions/upload-artifact@v6
      with:
        name: SonglistGenerator DLL r${{github.run_number}}
        path: SonglistGenerator/bin/Release/net10.0/SonglistGenerator.dll
        
    - name: Upload zip file with songbook source, containing new main and master files
      uses: actions/upload-artifact@v6
      with:
        name: Songbook v3.0 r${{github.run_number}}_source
        path: Songbook v3.0 r${{github.run_number}}
      
    - name: Compile songbook A4
      uses: xu-cheng/latex-action@v2
      with:
        root_file: "Spiewnik_chwyty.tex"
        working_directory: "Songbook v3.0 r${{github.run_number}}"
        
    - name: Upload generated PDF A4
      uses: actions/upload-artifact@v6
      with:
        name: Songbook v3.0 r${{github.run_number}}_pdf
        path: Songbook v3.0 r${{github.run_number}}/Spiewnik_chwyty.pdf
        
    - name: Upload generated PDF A4 (output log)
      uses: actions/upload-artifact@v6
      with:
        name: Songbook v3.0 r${{github.run_number}}_pdf_log
        path: Songbook v3.0 r${{github.run_number}}/Spiewnik_chwyty.log
        
    - name: Compile songbook A5
      uses: xu-cheng/latex-action@v2
      with:
        root_file: "Spiewnik_chwyty_a5.tex"
        working_directory: "Songbook v3.0 r${{github.run_number}}"

    - name: Upload generated PDF A5
      uses: actions/upload-artifact@v6
      with:
        name: Songbook v3.0 r${{github.run_number}}_pdf_a5
        path: Songbook v3.0 r${{github.run_number}}/Spiewnik_chwyty_a5.pdf
        
    - name: Upload generated PDF A5 (output log)
      uses: actions/upload-artifact@v6
      with:
        name: Songbook v3.0 r${{github.run_number}}_pdf_a5_log
        path: Songbook v3.0 r${{github.run_number}}/Spiewnik_chwyty_a5.log

  build_html:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: HtmlGenerator
      run: npm install

    - name: Install fonts
      run: sudo apt-get install -y fonts-inter

    - name: Install Playwright browsers
      working-directory: HtmlGenerator
      run: npx playwright install --with-deps chromium

    - name: Generate HTML
      working-directory: HtmlGenerator
      run: pwsh ./generate_web.ps1 -BuildNumber "r${{github.run_number}}"

    - name: Upload HTML
      uses: actions/upload-artifact@v6
      with:
        name: Spiewnik v3.0 r${{github.run_number}}_html
        path: HtmlGenerator/spiewnik.html

    - name: Run functional tests
      id: functional_tests
      working-directory: HtmlGenerator
      run: node functional_test.js

    - name: Run song display tests
      id: song_display_tests
      working-directory: HtmlGenerator
      run: node song_display_test.js

    - name: Upload functional test failure screenshots
      if: failure() && steps.functional_tests.outcome == 'failure'
      uses: actions/upload-artifact@v6
      with:
        name: Spiewnik v3.0 r${{github.run_number}}_functional_test_failures
        path: HtmlGenerator/functional_fails/

    - name: Upload song display test diffs
      if: failure() && steps.song_display_tests.outcome == 'failure'
      uses: actions/upload-artifact@v6
      with:
        name: Spiewnik v3.0 r${{github.run_number}}_snapshot_diffs
        path: HtmlGenerator/snapshots_diff/

  deploy_pages:

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build_html
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download generated HTML
      uses: actions/download-artifact@v6
      with:
        name: Spiewnik v3.0 r${{github.run_number}}_html
        path: site

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  create_release:

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build_pdf, build_html]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download PDF A4
      uses: actions/download-artifact@v6
      with:
        name: Songbook v3.0 r${{github.run_number}}_pdf
        path: release

    - name: Download PDF A5
      uses: actions/download-artifact@v6
      with:
        name: Songbook v3.0 r${{github.run_number}}_pdf_a5
        path: release

    - name: Download HTML
      uses: actions/download-artifact@v6
      with:
        name: Spiewnik v3.0 r${{github.run_number}}_html
        path: release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.0-r${{github.run_number}}
        name: Śpiewnik v3.0 r${{github.run_number}}
        body: |
          Automatyczny build #${{github.run_number}}

          Zawartość:
          - **Spiewnik_chwyty.pdf** — śpiewnik A4
          - **Spiewnik_chwyty_a5.pdf** — śpiewnik A5
          - **spiewnik.html** — wersja webowa (offline)
        files: |
          release/Spiewnik_chwyty.pdf
          release/Spiewnik_chwyty_a5.pdf
          release/spiewnik.html
